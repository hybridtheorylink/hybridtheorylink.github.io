<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice2Notion - Connecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #191919;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #999;
      line-height: 1.6;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      color: #ff6b6b;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎙️</div>
    <h1 id="title">Connecting to Notion...</h1>
    <p id="message">Redirecting back to Voice2Notion, please wait.</p>
    <div class="spinner" id="spinner"></div>
    <div class="error" id="error" style="display:none;"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var errorDesc = params.get('error_description');

      if (error) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Authorization Failed';
        document.getElementById('message').textContent = 'Please return to Voice2Notion and try again.';
        var errorEl = document.getElementById('error');
        errorEl.style.display = 'block';
        errorEl.textContent = errorDesc || error;
        return;
      }

      if (!code) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Missing Code';
        document.getElementById('message').textContent = 'No authorization code found. Please return to Voice2Notion and try again.';
        return;
      }

      // Build deep link with all original params forwarded
      var deepLink = 'voice2notion://notion-callback?' + params.toString();

      function showFallback() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Return to Voice2Notion';
        document.getElementById('message').textContent =
          'Authorization complete. Please switch back to the Voice2Notion app.';
      }

      // Use iframe to trigger deep link without causing App Store redirect popup
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLink;
      document.body.appendChild(iframe);

      // Also attempt direct navigation after short delay as fallback
      setTimeout(function () {
        window.location.href = deepLink;
      }, 300);

      // Detect if app opened via visibility change
      var appOpened = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) appOpened = true;
      });

      // Show fallback if app did not open within 2.5s
      setTimeout(function () {
        if (!appOpened) showFallback();
      }, 2500);
    })();
  </script>
</body>
</html>
